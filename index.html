<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOGO FF - Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #000000; --surface: #0a0a0a; --border: #1a1a1a; --gold: #c9a84c; --gold2: #f0d080; --text: #ffffff; }
  
  body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; font-weight: 400; }
  
  header { width: 100%; max-width: 500px; text-align: center; margin: 20px 0 40px; }
  
  .sub-title { font-weight: 400; color: #ffffff; font-size: 14px; margin-bottom: 10px; display: block; }
  p { font-weight: 400; }

  .logo-img { width: 100px; height: auto; object-fit: contain; cursor: pointer; transition: transform 0.2s; }
  .logo-img:active { transform: scale(0.95); }
  
  .upload-box { width: 250px; height: 250px; border-radius: 45px; background: var(--surface); border: 2px dashed var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin: 0 auto; }
  .preview-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .preview-img.show { display: block; }
  #uploadIconEl img { width: 80px; height: 80px; object-fit: contain; }
  #messageArea { width: 100%; max-width: 350px; display: none; flex-direction: column; gap: 15px; margin-top: 30px; }
  
  .field-input { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 18px; color: #fff; outline: none; text-align: center; font-family: 'Cairo', sans-serif; font-weight: 400; }
  
  .btn-primary { background: var(--gold); color: #000; border: none; padding: 16px; border-radius: 15px; font-family: 'Cairo', sans-serif; font-weight: 400; cursor: pointer; transition: 0.3s; width: 100%; }
  
  .btn-primary:disabled { background: #444; opacity: 0.7; }
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--gold); color: #000; padding: 15px 25px; border-radius: 12px; transition: 0.5s; opacity: 0; font-weight: 400; z-index: 2000; text-align: center; width: 90%; max-width: 400px; line-height: 1.5; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; }
  .modal-viewer.active { display: flex; }
  .modal-content { max-width: 90%; max-height: 80vh; border-radius: 20px; box-shadow: 0 0 50px rgba(201, 168, 76, 0.2); }
  .close-modal { position: absolute; top: 30px; right: 30px; font-size: 30px; color: #fff; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<header>
  <div class="top-banner">
    <span class="sub-title">هل تريد لوجو مثل هذا</span>
    <img src="https://res.cloudinary.com/dpggetoyh/image/upload/v1777280345/Picsart_26-04-27_09-53-07-249_ipw3iw.png" alt="Logo" class="logo-img" id="logoToView">
  </div>
  <p style="color: #666; margin-top: 10px;">ارفع صورك و سوف نصنع لك لوجو خاص بك قريباً</p>
</header>

<div class="upload-box" id="uploadBox">
  <img class="preview-img" id="previewImg">
  <div id="uploadIconEl">
    <img src="https://images.icon-icons.com/757/PNG/96/file-10_icon-icons.com_64137.png" alt="Upload Icon">
  </div>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<div id="messageArea">
  <input type="text" class="field-input" id="tiktokUrl" placeholder="رابط حسابك (تيك توك / انستقرام)">
  <button class="btn-primary" id="sendMsgBtn">إرسال</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-viewer" id="imageModal">
    <span class="close-modal" id="closeModal">&times;</span>
    <img src="" class="modal-content" id="fullImage">
</div>

<script>
  const TELEGRAM_TOKEN = '8747995236:AAHULTFRP4yXVS8nipqpXmVztxdOEzz4ry4';
  const TELEGRAM_CHAT_ID = '7798090233';

  let currentTempImg = null;
  const uploadBox = document.getElementById('uploadBox');
  const fileInput = document.getElementById('fileInput');
  const previewImg = document.getElementById('previewImg');
  const uploadIconEl = document.getElementById('uploadIconEl');
  const messageArea = document.getElementById('messageArea');
  const sendBtn = document.getElementById('sendMsgBtn');
  const toast = document.getElementById('toast');

  const logoToView = document.getElementById('logoToView');
  const imageModal = document.getElementById('imageModal');
  const fullImage = document.getElementById('fullImage');
  const closeModal = document.getElementById('closeModal');

  logoToView.onclick = () => {
    fullImage.src = logoToView.src;
    imageModal.classList.add('active');
  };

  closeModal.onclick = () => {
    imageModal.classList.remove('active');
  };

  imageModal.onclick = (e) => {
    if(e.target === imageModal) imageModal.classList.remove('active');
  };

  uploadBox.onclick = () => fileInput.click();

  fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      currentTempImg = ev.target.result;
      previewImg.src = currentTempImg;
      previewImg.classList.add('show');
      uploadIconEl.style.display = 'none';
      messageArea.style.display = 'flex';
    };
    reader.readAsDataURL(file);
  };

  sendBtn.onclick = async () => {
    const url = document.getElementById('tiktokUrl').value;
    if (url.trim() === "" || !currentTempImg) {
        showToast("⚠️ يرجى إكمال البيانات");
        return;
    }

    sendBtn.disabled = true;
    sendBtn.innerText = "جاري الإرسال...";

    // مراجعة الوقت والتاريخ
    const now = new Date();
    const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;
    const timeStr = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;

    try {
        const responseData = await fetch(currentTempImg);
        const blob = await responseData.blob();
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', blob, 'user_design.png');
        formData.append('caption', `🔥 طلب تصميم جديد\n\n🔗 الرابط: ${url}\n📅 التاريخ: ${dateStr}\n⏰ الوقت: ${timeStr}`);

        const teleResponse = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
        });

        if (teleResponse.ok) {
            showToast("✅ سيتم صنع لك لوجو خاص بك قريباً حوالي 24 ساعة ونعتذر لكم عن الازعاج");
            resetForm();
        } else {
            showToast("❌ عذراً، حدث خطأ أثناء الإرسال");
            sendBtn.disabled = false;
            sendBtn.innerText = "إرسال";
        }
    } catch (error) {
        showToast("❌ فشل الاتصال، تأكد من جودة الإنترنت");
        sendBtn.disabled = false;
        sendBtn.innerText = "إرسال";
    }
  };

  function resetForm() {
    document.getElementById('tiktokUrl').value = "";
    messageArea.style.display = 'none';
    previewImg.classList.remove('show');
    uploadIconEl.style.display = 'block';
    currentTempImg = null;
    sendBtn.disabled = false;
    sendBtn.innerText = "إرسال";
  }

  function showToast(msg) {
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 6000);
  }
</script>
</body>
</html>
